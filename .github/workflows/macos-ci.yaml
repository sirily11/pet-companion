name: macOS CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.0'
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Run app tests
        run: xcodebuild -project CatCompanion.xcodeproj -scheme CatCompanion -destination 'platform=macOS' -derivedDataPath output/Tests CODE_SIGN_IDENTITY=- ENABLE_APP_SANDBOX=NO CODE_SIGN_ENTITLEMENTS='' test
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python3 -m pip install cryptography
      - run: python3 scripts/ci/test_validate_appcast.py
